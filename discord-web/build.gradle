plugins {
    id "com.android.application"
}

android {
    namespace "ru.alikdrone.discordweb"
    compileSdk 30

    defaultConfig {
        applicationId "ru.alikdrone.discordweb"
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }

    lint {
        disable "ExpiredTargetSdkVersion", "GradleDependency"
    }
}
