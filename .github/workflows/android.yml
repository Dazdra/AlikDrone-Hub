name: Android checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  github-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Test and build public catalog
        shell: bash
        run: |
          ./gradlew --no-daemon testGithubUnitTest lintGithub assembleGithub

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AlikDrone-Hub-GitHub
          path: app/build/outputs/apk/github/app-github.apk
          if-no-files-found: error
